      <rect width="36" height="36" fill="#fff"/>
      <rect x="6" y="6" width="22" height="22" rx="6.5" fill="#000" stroke="#000" stroke-width="4.4"/>
    </mask>
    <mask id="f" maskUnits="userSpaceOnUse" x="0" y="0" width="36" height="36">
