# Builds DollPet (electron/) for Windows and macOS. Run it from the Actions tab, or push a tag like v0.1.0 to also
# attach the installers to a GitHub release of that tag.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      # the face-tracking files are not in the repository (vendor/mediapipe is ignored)
      - name: Fetch MediaPipe
        shell: bash
        run: vendor/fetch-mediapipe.sh

      - name: Install
        working-directory: electron
        run: npm ci

      # koffi (wallpaper mode, native.js) ships one binary package per platform and npm installs only this machine's;
      # the other architecture built here needs its own too
      - name: Add koffi for the other architecture
        working-directory: electron
        shell: bash
        run: |
          V=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/koffi/package.json')).version")
          # --force: npm otherwise refuses a package made for another CPU
          if [ "$RUNNER_OS" = macOS ]; then
            npm install --no-save --force "@koromix/koffi-darwin-x64@$V" "@koromix/koffi-darwin-arm64@$V"
          else
            npm install --no-save --force "@koromix/koffi-win32-arm64@$V" "@koromix/koffi-win32-x64@$V"
          fi
          ls node_modules/@koromix

      # unsigned: no Apple Developer ID or Windows certificate yet (see README)
      - name: Build
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: DollPet-${{ runner.os }}
          path: |
            electron/dist/*.dmg
            electron/dist/*.zip
            electron/dist/*.exe

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron/dist/*.dmg
            electron/dist/*.zip
            electron/dist/*.exe
